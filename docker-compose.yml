services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mimo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimo
      POSTGRES_PASSWORD: mimo_dev
      POSTGRES_DB: mimo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimo -d mimo"]
      interval: 10s
      timeout: 5s
      retries: 5

  mimo-api:
    build:
      context: .
      dockerfile: src/Mimo.Api/Dockerfile
    container_name: mimo_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=mimo;Username=mimo;Password=mimo_dev"
      Jwt__Issuer: "mimo-api"
      Jwt__Audience: "mimo-clients"
      Jwt__Key: "${MIMO_JWT_KEY}"
      DeepSeek__ApiKey: "${DEEPSEEK_API_KEY}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mimo-admin-api:
    build:
      context: .
      dockerfile: src/Mimo.Admin.Api/Dockerfile
    container_name: mimo_admin_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=mimo;Username=mimo;Password=mimo_dev"
      Jwt__Issuer: "mimo-admin-api"
      Jwt__Audience: "mimo-admin-clients"
      Jwt__Key: "${MIMO_ADMIN_JWT_KEY}"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
